<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Bem-Estar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">
    <section id="inicio" class="tela ativa">
      <div class="icone">🧠</div>

      <h1>Meu Bem-Estar</h1>

      <p>
        Conheça melhor suas emoções através de
        autoavaliações de bem-estar.
      </p>

      <button onclick="mostrarTestes()">
        Começar
      </button>

      <small>
        Este aplicativo é educativo e não substitui
        avaliação de um profissional de saúde.
      </small>
    </section>

    <section id="testes" class="tela">
      <h2>Escolha um teste</h2>

      <button>🌱 Experiências na infância</button>
      <button>💭 Impacto emocional</button>
      <button>❤️ Relacionamentos</button>
      <button>⭐ Autoestima</button>
      <button>🌿 Ansiedade e estresse</button>
      <button>🌸 Bem-estar emocional</button>

      <button class="voltar" onclick="voltarInicio()">
        Voltar
      </button>
    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
