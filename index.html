<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Bem-Estar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <section id="inicio" class="tela ativa">
    <h1>🧠 Meu Bem-Estar</h1>
    <p>Autoavaliações de bem-estar emocional.</p>

    <button id="btnComecar">Começar</button>

    <small>
      Este aplicativo é educativo e não fornece diagnóstico.
    </small>
  </section>

  <section id="testes" class="tela">
    <h2>Escolha um teste</h2>

    <button id="btnInfancia">
      🌱 Experiências na infância
    </button>

    <button id="btnImpacto">
      💭 Impacto emocional
    </button>

    <button id="btnVoltar">Voltar</button>
  </section>

  <section id="pergunta" class="tela">
    <p id="progresso"></p>

    <h2 id="textoPergunta"></h2>

    <button class="resposta" data-pontos="0">Nunca</button>
    <button class="resposta" data-pontos="1">Raramente</button>
    <button class="resposta" data-pontos="2">Às vezes</button>
    <button class="resposta" data-pontos="3">Frequentemente</button>
    <button class="resposta" data-pontos="4">Quase sempre</button>
  </section>

  <section id="resultado" class="tela">
    <h2 id="resultadoTitulo">Resultado</h2>
    <p id="resultadoTexto"></p>

    <button id="btnInicio">Voltar ao início</button>
  </section>

</div>

<script src="script.js"></script>

</body>
</html>
